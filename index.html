<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Skin Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#fff;--ink:#0f2a43;--mut:#5b7189;--blue:#4a9de3;--soft:#eef6fc;--line:#dce9f4;--card:#fff;--pn:#d9eaf7;--serif:"Playfair Display",Georgia,serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1622;--ink:#e6f1fb;--mut:#93a9bf;--soft:#12263a;--line:#23405c;--card:#0f1f2f;--pn:#0d2236}}
:root[data-theme="dark"]{--bg:#0b1622;--ink:#e6f1fb;--mut:#93a9bf;--soft:#12263a;--line:#23405c;--card:#0f1f2f;--pn:#0d2236}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Inter,system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:56px 24px 560px}
.top{text-align:left;padding:10px 0 20px}.tag{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--mut)}
h1{font-family:var(--serif);font-weight:500;font-size:clamp(48px,9vw,88px);line-height:1;margin:14px 0 10px}h1 span{color:var(--blue)}.top p{color:var(--mut);font-size:18px;margin:0}
.sec{margin-top:120px}.sh{text-align:left;margin-bottom:48px}.sh span{font-size:12px;letter-spacing:.3em;color:var(--blue);font-weight:700}
.sh h2{font-family:var(--serif);font-weight:500;font-size:clamp(28px,5vw,42px);margin:8px 0}.sh p{color:var(--mut);margin:0;font-size:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:40px}
textarea{width:100%;border:1px solid var(--line);border-radius:12px;padding:14px;font:inherit;background:var(--soft);color:var(--ink);resize:vertical;min-height:80px}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:12px 24px;background:var(--blue);color:#fff;font-weight:600;transition:.2s}
button:hover{transform:translateY(-1px);box-shadow:0 8px 20px -8px var(--blue)}button:disabled{opacity:.45;cursor:default;transform:none;box-shadow:none}
button.g{background:var(--soft);color:var(--ink);border:1px solid var(--line)}.chip{font-size:13px;padding:8px 14px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px;justify-content:flex-start}
.feels{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px;margin-bottom:24px}
.feel{background:var(--card);color:var(--ink);border:1.5px solid var(--line);padding:20px 12px;font-size:15px;border-radius:14px}
.feel.on{border-color:var(--blue);background:var(--soft);box-shadow:0 0 0 3px rgba(74,157,227,.2)}
.shelf{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:28px}
.vial{touch-action:none;user-select:none;text-align:center;padding:28px 18px;border:1px solid var(--line);border-radius:22px;cursor:grab;background:var(--card);animation:in .7s both;transition:.2s}
.vial:hover{transform:translateY(-4px)}.vial.sel{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,157,227,.2)}.vial.used{opacity:.45}
.bt{width:46px;height:84px;margin:0 auto 12px;border-radius:8px 8px 16px 16px;border:2px solid #fff;box-shadow:0 0 0 1px var(--line),inset 5px 0 8px rgba(255,255,255,.8);position:relative}
.bt:before{content:"";position:absolute;left:12px;top:-14px;width:18px;height:14px;background:#cfe6fa;border-radius:4px 4px 0 0;border:1px solid var(--line)}
.vial small{display:block;color:var(--mut);font-size:12.5px;line-height:1.45;margin-top:6px}
@keyframes in{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
.ghost{position:fixed;pointer-events:none;z-index:99;transform:translate(-50%,-50%);padding:10px 16px;border-radius:99px;color:#fff;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.det{font-size:15px;line-height:1.6;color:var(--mut);background:var(--soft);border-radius:18px;padding:30px;margin-top:36px;line-height:1.75}.det b{color:var(--ink)}
.bench{display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:start}@media(max-width:860px){.bench{grid-template-columns:1fr}}
.side h3{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:0 0 12px}.side h3+*{margin-bottom:44px}
.ic{display:inline-block;font-size:13px;padding:5px 12px;border-radius:99px;border:1px solid var(--line);margin:3px 4px 3px 0;color:var(--mut)}.ic.hit{background:var(--blue);color:#fff;border-color:var(--blue)}
.feat{display:flex;gap:20px;margin-bottom:32px;animation:in .6s both}.fn{font-family:var(--serif);font-size:34px;color:var(--blue);line-height:1}
.feat p{margin:8px 0 4px;font-size:14px;color:var(--mut);line-height:1.5}.feat small{font-size:12px;color:var(--blue)}.feat>div:last-child{flex:1}
.bar{height:8px;border-radius:9px;background:var(--soft);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:linear-gradient(90deg,#9bd0ff,var(--blue));transition:width 1s}
.beak{transition:filter .3s}.beak.over{filter:drop-shadow(0 0 18px rgba(59,156,240,.7))}
.mol{animation:fl var(--d) ease-in-out infinite alternate}@keyframes fl{from{transform:translate(0,0) rotate(0)}to{transform:translate(var(--dx),var(--dy)) rotate(40deg)}}
.sl{animation:slosh 3s linear infinite}@keyframes slosh{to{transform:translateX(120px)}}
.bub{animation:rise var(--d) ease-in infinite}@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-150px);opacity:0}}
.drop{animation:fall .8s cubic-bezier(.5,0,1,.6) forwards}@keyframes fall{from{transform:translateY(-10px)}to{transform:translateY(170px);opacity:.2}}
.rip{transform-box:fill-box;transform-origin:center;animation:rp 1s ease-out forwards}@keyframes rp{from{transform:scale(.2);opacity:.9}to{transform:scale(3);opacity:0}}
.three{height:clamp(340px,56vw,520px);border-radius:20px;position:relative;overflow:hidden;background:radial-gradient(circle at 50% 30%,#16293c,#0b1520);border:1px solid var(--line);cursor:grab}
.three canvas{display:block;width:100%;height:100%}.hint{position:absolute;bottom:12px;left:0;right:0;text-align:center;font-size:12px;color:var(--mut);pointer-events:none}
.mets{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:24px}.mets div div{font-size:13px;color:var(--mut);display:flex;justify-content:space-between}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:32px}.prod{animation:in .7s both;display:flex;flex-direction:column;gap:10px}
.note{font-size:13px;color:var(--mut);line-height:1.6}
.spin{animation:sp 1s linear infinite;display:inline-block}@keyframes sp{to{transform:rotate(360deg)}}
.scan{height:3px;background:linear-gradient(90deg,transparent,var(--blue),transparent);animation:sc 1.2s ease-in-out infinite}@keyframes sc{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
.pip{position:fixed;right:20px;bottom:20px;width:min(520px,calc(100vw - 24px));z-index:50;background:#0e1b29;color:#dbe8f5;border:1px solid #23405c;border-radius:18px;box-shadow:0 20px 50px -10px rgba(0,0,0,.45);overflow:hidden;animation:in .5s both}
.pip.big{width:min(580px,calc(100vw - 24px))}.ph{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;cursor:grab;touch-action:none;user-select:none}
.ph button{background:transparent;border:1px solid #2c4b6a;color:#dbe8f5;padding:4px 10px;font-size:12px;border-radius:6px;margin-left:6px;box-shadow:none}
.pip .three{height:300px;border:0;border-radius:0}.pip.big .three{height:340px}.pip .hint{display:none}
.pm{padding:12px 14px 4px;display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;font-size:11px;color:#93a9bf}.pip .bar{background:#1b3248;height:6px}.pip .bar i{background:linear-gradient(90deg,#3f6f9e,#78b0e6)}
.pn{padding:6px 14px 12px;font-size:11px;color:#7d93a9}
@media(max-width:640px){.pip{right:12px;bottom:12px}.pip .three{height:200px}.pn{display:none}.wrap{padding:28px 16px 480px}}
.feel{text-align:left}.feel small{display:block;color:var(--mut);font-size:12px;margin-top:4px}
.lbl{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--blue);margin:44px 0 18px}.sws{display:flex;gap:10px;flex-wrap:wrap}
button.sw{width:38px;height:38px;padding:0;border-radius:50%;border:3px solid var(--card);box-shadow:0 0 0 1px var(--line)}button.sw.on{box-shadow:0 0 0 2px var(--blue)}button.sw.s{width:28px;height:28px;border-color:#0e1b29;box-shadow:0 0 0 1px #2c4b6a}button.sw.s.on{box-shadow:0 0 0 2px #78b0e6}
button.cn{padding:9px 16px;border-radius:99px;background:var(--card);color:var(--ink);border:1.5px solid var(--line);font-weight:500}button.cn.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.pt{display:flex;gap:6px;padding:4px 14px 6px;flex-wrap:wrap}
.b3{width:100%;height:150px;margin-bottom:14px}.b3 canvas{display:block;margin:0 auto}.pl{width:100%;font-size:11px;color:#93a9bf;letter-spacing:.14em;text-transform:uppercase}.dh{font-size:11px;letter-spacing:.08em;color:#7d93a9;text-transform:none}.pip .pm{padding-top:16px}.pt{gap:10px;padding:14px 14px 8px}
.ghost.gb{padding:0;border-radius:0;box-shadow:none;background:none;filter:drop-shadow(0 12px 14px rgba(0,0,0,.3));transform:translate(-50%,-60%) rotate(-12deg);text-align:center;color:var(--ink);font-size:12px;font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;padding:2px 14px 6px;font-size:11px;color:#93a9bf}.lg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle}
.rec{border-color:var(--blue);box-shadow:0 0 0 3px rgba(74,157,227,.15)}.rh{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin:10px 0 18px}.rh h3{font-family:var(--serif);font-weight:500;font-size:clamp(24px,4vw,34px);margin:6px 0 4px}.pct{font-family:var(--serif);font-size:56px;line-height:1;color:var(--blue);white-space:nowrap}.pct small{font-size:14px;font-family:inherit;color:var(--mut);margin-left:4px}.cmp{margin-top:22px;display:grid;gap:16px}.cmp .lab{font-size:12px;color:var(--mut);display:flex;justify-content:space-between}
.vial{position:relative}.rt{position:absolute;top:12px;right:12px;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);font-weight:700}.sc{padding:10px 14px 0;font-size:12px;color:#93a9bf}.sc b{color:#9fe0c4;font-size:18px}.sc .up{color:#9fe0c4;font-weight:600}
.card.p2{padding:28px}.shelf2{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;max-height:340px;overflow:auto;padding:4px}.shelf2 .vial{padding:12px 6px;border-radius:16px;font-size:13px}.shelf2 .rt{position:static;display:block;height:13px;margin-bottom:4px;font-size:9px}.shelf2 .vial b{display:block;line-height:1.25}.det{margin-top:20px;padding:22px}.pip.inl{position:static;width:auto;right:auto;bottom:auto;box-shadow:none;animation:none}.pip.inl .three{height:clamp(300px,40vw,380px)}
.pip .three{height:var(--ph,300px)}.ph .dh{margin-left:auto;margin-right:10px;white-space:nowrap}
.ph{flex-wrap:wrap;gap:6px 10px;letter-spacing:.08em}.ph>span:first-child{flex:1 1 auto;min-width:0;white-space:normal;overflow-wrap:anywhere;line-height:16px}.ph>span:last-child{flex:0 0 auto;white-space:nowrap}
.shelf2.own{box-shadow:0 0 0 2px var(--blue);border-radius:16px}

.det,.feel{font-size:16px;line-height:24px}.feel{font-weight:400}

.note,.feat p,.ic,.vial b,.shelf2 .vial{font-size:14px;line-height:20px}

.fn{font-family:var(--sans);font-size:32px;line-height:40px;font-weight:600}

.rh h3{font-family:var(--sans);font-size:24px;line-height:32px;font-weight:600}
@media(max-width:640px){body{line-height:26px}h1{font-size:32px;line-height:40px}.sh h2{font-size:24px;line-height:32px}.sh p{font-size:18px;line-height:24px}button{font-size:16px;line-height:20px}.det,.feel{line-height:26px}.fn{font-size:24px;line-height:32px}.pct{font-size:32px;line-height:40px}.rh h3{font-size:20px;line-height:28px}.ph button{font-size:12px}}
.vial.rc{background:rgba(74,157,227,.14);border-color:#9bd0ff}.card.shc{padding:0;align-self:stretch;position:relative;min-height:420px}.shin{position:absolute;inset:28px;display:flex;flex-direction:column;min-height:0}.shin .shelf2{flex:1;min-height:0;max-height:none}.shin .det{flex:none;max-height:42%;overflow:auto;margin-top:16px}
@media(max-width:860px){.card.shc{padding:28px;min-height:0}.shin{position:static}.shin .shelf2{max-height:340px}.shin .det{max-height:none}}
.mrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:14px;line-height:20px;color:var(--mut)}.mrow.no{opacity:.6}.mrow .ic{flex:none;margin:0}.mrow span:last-child{flex:1;min-width:0}
.sec{margin-top:80px}.sh{margin-bottom:80px}.lbl{margin-top:80px}.sh+.lbl{margin-top:0}.side h3+*{margin-bottom:80px}.side h3:last-child,.side>*:last-child{margin-bottom:0}
@media(max-width:640px){.sec{margin-top:56px}.sh{margin-bottom:48px}.lbl{margin-top:56px}.side h3+*{margin-bottom:56px}}

<script>
const {useState,useRef,useEffect}=React,h=React.createElement;
// Educational ingredient data. e = effect points on skin-model meters.
const ING={
ha:{n:"Hyaluronic acid",c:"#6cc0ff",s:"humectant that binds water",sci:"A humectant: it attracts and holds many times its weight in water, helping the outer skin layers look plumper and feel softer. It supports surface hydration; it is not a moisturizer by itself, so it pairs well with an emollient.",e:{hyd:3}},
gly:{n:"Glycerin",c:"#9fe0e8",s:"humectant that draws in water",sci:"One of the most studied humectants. It pulls water into the stratum corneum and helps keep it supple, especially when paired with lipids.",e:{hyd:2,bar:1}},
cer:{n:"Ceramides",c:"#a9b8ff",s:"skin-identical barrier lipids",sci:"Ceramides are lipids that make up a large share of the “mortar” between skin cells. Replenishing them helps the barrier hold water in and keep irritants out.",e:{bar:3,hyd:1}},
nia:{n:"Niacinamide",c:"#FBF2F5",s:"Calms, strengthens, and evens skin tone",t:"Calms, strengthens, and evens skin tone.",sci:"A form of vitamin B3. Studies show it supports barrier function and can visibly improve the look of pores, uneven tone and oiliness over weeks of use.",e:{bar:1,clr:1,rad:1,calm:1}},
sal:{n:"Salicylic acid",c:"#ff9ec4",s:"oil-soluble BHA for pores",sci:"A beta-hydroxy acid. Because it dissolves in oil, it can work inside pores to loosen the mix of sebum and dead cells behind blackheads and breakouts.",e:{clr:3,ren:1},w:"Can dry or irritate; start slowly and use daily sunscreen."},
lha:{n:"LHA",c:"#ffb4a2",s:"gentle lipo-hydroxy acid",sci:"Capryloyl salicylic acid is a salicylic-acid derivative used by La Roche-Posay for gentler, more targeted exfoliation of the skin surface and pore lining.",e:{clr:2,ren:2},w:"Exfoliating acid: use daily sunscreen."},
ret:{n:"Retinol",c:"#ffb066",s:"vitamin A for renewal",sci:"A vitamin A derivative that is converted in skin to retinoic acid. It encourages cell turnover and is among the best-studied ingredients for the look of fine lines and uneven texture.",e:{ren:3,rad:1},w:"Can irritate and increases sun sensitivity. Not for use in pregnancy; ask a clinician if unsure."},
vc:{n:"Vitamin C",c:"#ffc94d",s:"antioxidant for radiance",sci:"Ascorbic acid is an antioxidant that helps neutralize free radicals from UV and pollution, supports collagen production, and can visibly brighten dull-looking skin.",e:{rad:3}},
pan:{n:"Panthenol (B5)",c:"#8fe3c0",s:"soothing pro-vitamin B5",sci:"Converted to vitamin B5 in skin. It attracts water, supports barrier recovery and helps skin feel more comfortable after dryness or irritation.",e:{calm:3,hyd:1,bar:1}},
mad:{n:"Madecassoside",c:"#9ed9a0",s:"Centella-derived soother",sci:"A compound from Centella asiatica traditionally used in soothing skincare. It is formulated to help skin feel calmer and more comfortable.",e:{calm:2}},
mel:{n:"Melasyl",c:"#F7F7F7",s:"Brightens and helps reduce dark spots",t:"Brightens and helps reduce dark spots.",sci:"Melasyl is a patented La Roche-Posay molecule. The brand reports that it targets excess melanin production to help visibly reduce dark spots and even out skin tone. It is designed for all skin tones; results build with consistent use and daily sunscreen.",e:{rad:3},w:"Dark spots can darken with sun exposure. Use daily broad-spectrum SPF."},
tsw:{n:"Thermal Spring Water",c:"#ECFEFF",s:"Soothes, protects, and supports a healthy skin barrier",t:"Soothes, protects, and supports a healthy skin barrier.",sci:"La Roche-Posay’s spring water in France is reported by the brand to be rich in selenium, with soothing and antioxidant properties. It serves as a gentle, mineral-containing base.",e:{calm:2,rad:1}}};
const CK=[[/dry|dehydrat|tight|thirst|moistur|parch/,"dryness",["ha","gly","cer","pan"]],[/sensitiv|red|irritat|sting|reactive|calm|rosacea-prone/,"sensitivity",["pan","mad","tsw","cer","nia"]],[/oil|shin|pore|acne|pimple|breakout|blackhead|clog|blemish/,"oiliness & pores",["sal","lha","nia","gly"]],[/aging|ageing|wrinkle|fine line|firm|mature|anti-?age/,"early signs of aging",["ret","vc","ha","nia"]],[/dull|bright|dark spot|uneven|tone|glow|tired|pigment/,"dullness & uneven tone",["vc","nia","ret","ha"]],[/barrier|flak|peel|rough|damag|repair/,"a compromised-feeling barrier",["cer","gly","pan","mad"]]];

const PROD=[{n:"Hyalu B5 Serum",f:"Hydration & plumping",i:["ha","pan","mad"]},{n:"Toleriane Double Repair Moisturizer",f:"Barrier support, all-day hydration",i:["cer","nia","gly","tsw"]},{n:"Effaclar Ultra Concentrated Serum",f:"Pores & breakout-prone skin",i:["sal","lha","nia"]},{n:"Cicaplast Baume B5",f:"Soothing & skin recovery",i:["pan","mad","gly"]},{n:"Pure Vitamin C10 Serum",f:"Radiance & antioxidant care",i:["vc","sal"]},{n:"Mela B3 Serum",f:"Dark spots & even tone",i:["mel","nia"]},{n:"Retinol B3 Serum",f:"Renewal & fine lines",i:["ret","nia"]}];
const MET=[["hyd","Hydration"],["bar","Barrier"],["clr","Clear pores"],["rad","Radiance"],["calm","Comfort"],["ren","Renewal"]];
const EX=["My skin feels tight and dry in winter","Oily T-zone with clogged pores","Dull skin and early fine lines","Sensitive, easily red skin"];
function demo(t){t=t.toLowerCase();const sc={},lab={};CK.forEach(([r,l,p])=>{if(r.test(t))p.forEach((id,k)=>{sc[id]=(sc[id]||0)+4-k;(lab[id]=lab[id]||[]).push(l)})});
let ids=Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).slice(0,5);const none=!ids.length;if(none)ids=["ha","nia","cer","tsw"];
return{summary:none?"I didn’t spot a specific concern, so here is a gentle, well-rounded starter set.":"Your description points to: "+[...new Set(ids.flatMap(i=>lab[i]))].join(", ")+".",picks:ids.map(id=>({id,why:none?ING[id].s:"For "+[...new Set(lab[id])].join(" & ")+": "+ING[id].s+"."}))}}
async function ai(t){const sm=window.claude&&await window.claude.use("sample");if(!sm)throw 0;
